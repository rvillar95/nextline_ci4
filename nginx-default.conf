# Configuración Nginx para Azure App Service (PHP 8) - CodeIgniter 4
# Sin esto, /login da 404; solo funciona /index.php/login
#
# Cómo aplicar:
# 1. Por SSH en el App Service: cp /etc/nginx/sites-enabled/default /home/site/default
# 2. Editar /home/site/default y en el bloque location / poner:
#
#    location / {
#        index  index.php index.html index.htm hostingstart.html;
#        try_files $uri $uri/ /index.php$request_uri;
#    }
#
# 3. Crear /home/site/startup.sh con:
#    #!/bin/bash
#    cp /home/site/default /etc/nginx/sites-enabled/default
#    service nginx reload
# 4. chmod +x /home/site/startup.sh
# 5. En Azure Portal: App Service nutrinext → Configuración → Configuración general
#    → Comando de inicio: /home/site/startup.sh → Guardar y reiniciar la app.
#
# Referencia: https://azureossd.github.io/2021/09/02/php-8-rewrite-rule/

location / {
    index  index.php index.html index.htm hostingstart.html;
    try_files $uri $uri/ /index.php$request_uri;
}
